name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SDK
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Verify dist does not exist in source
        run: |
          if git ls-files --error-unmatch dist/ 2>/dev/null; then
            echo "ERROR: dist/ is tracked in git — remove it and add to .gitignore"
            exit 1
          fi
          echo "OK: dist/ is not tracked in git"
