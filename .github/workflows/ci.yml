name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build workspaces
        run: npm run build

      - name: Test workspaces
        run: npm run test

      - name: Check generated build output is not tracked
        run: |
          if git ls-files | grep -E '(^|/)dist(-test)?/'; then
            echo "ERROR: generated dist output is tracked in git"
            exit 1
          fi
